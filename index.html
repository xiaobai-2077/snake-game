<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 - 自由移动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #0a0a1a;
    font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
    user-select: none; cursor: none;
  }
  .main { display: flex; gap: 24px; align-items: flex-start; padding: 20px; max-width: 900px; width: 100%; }
  .game-panel { flex-shrink: 0; }
  h1 { color: #e94560; text-align: center; margin-bottom: 8px; font-size: 1.8rem; letter-spacing: 6px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 10px; }
  .score-group { display: flex; gap: 10px; align-items: center; }
  .badge { padding: 3px 12px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; color: #fff; }
  .badge-score { background: #e94560; }
  .badge-high { background: #533483; }
  .badge-skin { background: #0f3460; font-weight: normal; font-size: 0.75rem; }
  .progress-wrap { height: 4px; background: #1a1a3e; border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #e94560, #f39c12); border-radius: 2px; transition: width 0.3s; }
  .progress-label { color: #666; font-size: 0.7rem; text-align: right; margin-bottom: 2px; }
  .canvas-wrap { position: relative; display: inline-block; line-height: 0; }
  canvas { border: none; border-radius: 8px; background: #0a0a1a; display: block; }

  .overlay {
    position: absolute; inset: 0; border-radius: 8px;
    background: rgba(5,5,20,0.88); display: flex;
    justify-content: center; align-items: center; z-index: 10;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-content { text-align: center; }
  .overlay h2 { color: #e94560; font-size: 2rem; letter-spacing: 6px; margin-bottom: 12px; }
  .overlay .final-score { color: #aaa; font-size: 1rem; margin-bottom: 16px; }
  .overlay .final-score b { color: #f39c12; font-size: 1.3rem; }
  .overlay button {
    padding: 10px 36px; font-size: 1.1rem; background: #e94560; color: #fff;
    border: none; border-radius: 20px; cursor: pointer; letter-spacing: 3px;
    font-family: inherit; transition: background 0.2s, transform 0.1s;
  }
  .overlay button:hover { background: #c23152; }
  .overlay button:active { transform: scale(0.95); }
  .diff-group { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .diff-btn {
    padding: 5px 14px; font-size: 0.8rem; background: #1a1a3e; color: #888;
    border: 2px solid transparent; border-radius: 14px; cursor: pointer;
    font-family: inherit; letter-spacing: 1px; transition: all 0.2s;
  }
  .diff-btn:hover { color: #ddd; border-color: #444; }
  .diff-btn.sel { color: #fff; border-color: #e94560; background: #2a1a3e; }
  .diff-badge { padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; }

  .float-text {
    position: absolute; pointer-events: none; font-weight: bold;
    color: #f39c12; font-size: 0.95rem; animation: floatUp 0.6s ease-out forwards; z-index: 5;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-30px); }
  }

  .msg { color: #e94560; font-size: 0.95rem; height: 22px; text-align: center; margin-top: 2px; }
  .tips { margin-top: 8px; color: #555; font-size: 0.75rem; text-align: center; }
  .tips span { color: #e94560; }
  button.sound-btn {
    width: 32px; height: 32px; padding: 0; border-radius: 50%;
    font-size: 1.1rem; line-height: 32px; text-align: center;
    background: #1a1a3e; border: none; color: #fff; cursor: pointer; flex-shrink: 0;
    transition: background 0.2s;
  }
  button.sound-btn:hover { background: #2a2a5e; }

  .skin-panel { background: #111128; border-radius: 10px; padding: 14px; border: 1px solid #222; width: 220px; }
  .skin-panel h3 { color: #e94560; font-size: 1rem; text-align: center; margin-bottom: 10px; letter-spacing: 3px; }
  .skin-grid { display: flex; flex-direction: column; gap: 6px; }
  .skin-card {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-radius: 8px; cursor: pointer; background: #0f0f23;
    border: 1px solid #1a1a3e; transition: border-color 0.2s, transform 0.1s, opacity 0.2s;
  }
  .skin-card:hover { border-color: #444; }
  .skin-card:active { transform: scale(0.97); }
  .skin-card.active { border-color: #e94560; box-shadow: 0 0 8px rgba(233,69,96,0.3); }
  .skin-card.locked { opacity: 0.35; cursor: not-allowed; }
  .skin-card.locked:hover { border-color: #1a1a3e; }
  .skin-card.locked:active { transform: none; }
  .skin-swatch {
    width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .skin-info { flex: 1; min-width: 0; }
  .skin-name { color: #ddd; font-size: 0.8rem; font-weight: bold; }
  .skin-score { color: #666; font-size: 0.65rem; }
  .skin-panel-footer { margin-top: 10px; text-align: center; }
  .skin-panel-footer a {
    color: #444; font-size: 0.7rem; cursor: pointer; text-decoration: none;
    transition: color 0.2s;
  }
  .skin-panel-footer a:hover { color: #e94560; }
  body.playing .skin-card { pointer-events: none; opacity: 0.5; cursor: default; }
  body.playing .skin-card.active { opacity: 0.8; }

  @media (max-width: 700px) {
    body { align-items: flex-start; padding-top: 2px; background: #080818; overflow: hidden; }
    .main { flex-direction: column; align-items: center; gap: 4px; padding: 4px; }
    .game-panel { max-width: 100%; width: 100%; }
    h1 { font-size: 1rem; letter-spacing: 2px; margin-bottom: 0; }
    .top-bar { margin-bottom: 1px; }
    .badge { font-size: 0.62rem; padding: 1px 6px; }
    .progress-wrap { margin-bottom: 1px; height: 2px; }
    .progress-label { font-size: 0.55rem; }
    .canvas-wrap { display: flex; justify-content: center; }
    canvas { border-radius: 4px; max-width: 100vw; }
    .overlay h2 { font-size: 1.1rem; letter-spacing: 3px; }
    .overlay button { padding: 6px 16px; font-size: 0.75rem; }
    .diff-btn { font-size: 0.62rem; padding: 3px 8px; }
    .msg { font-size: 0.7rem; height: 14px; }
    .tips { display: none; }
    .diff-badge { font-size: 0.6rem; }
    .skin-panel {
      width: 100%; max-width: 100%; border-radius: 8px 8px 0 0;
      padding: 6px; max-height: 110px; overflow-y: auto; flex-shrink: 0; border: none;
      background: #0c0c20;
    }
    .skin-grid { flex-direction: row; flex-wrap: wrap; gap: 2px; }
    .skin-card { flex: 0 0 calc(33.3% - 2px); padding: 2px 4px; }
    .skin-name { font-size: 0.6rem; }
    .skin-score { font-size: 0.5rem; }
    .skin-swatch { width: 18px; height: 18px; border-radius: 3px; }
    .skin-panel h3 { font-size: 0.7rem; margin-bottom: 2px; letter-spacing: 1px; }
  }
</style>
</head>
<body>

<div class="main">
  <div class="game-panel">
    <h1>贪 吃 蛇</h1>
    <div class="top-bar">
      <div class="score-group">
        <span class="badge badge-score">得分 <b id="score">0</b></span>
        <span class="badge badge-high">最高 <b id="high">0</b></span>
        <span class="badge badge-skin" id="skinBadge">经典绿</span>
        <span class="diff-badge" id="diffBadge">普通</span>
      </div>
      <button class="sound-btn" id="soundBtn" title="音乐">🔊</button>
    </div>
    <div class="progress-label" id="progressLabel">下一皮肤: 烈焰红 (还需50分)</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-content" id="overlayContent"></div>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="tips">鼠标移动控制方向 · <span>空格</span> 暂停 · <span>双击</span>画布暂停</div>
  </div>

  <div class="skin-panel">
    <h3>皮肤仓库</h3>
    <div class="skin-grid" id="skinGrid"></div>
    <div class="skin-panel-footer">
      <a id="exportLink">导出存档</a> · <a id="importLink">导入存档</a> · <a id="resetLink">重置</a>
    </div>
  </div>
</div>

<script>
// ============ AUDIO ENGINE ============
const AudioEngine = (() => {
  let ctx = null, bgmPlaying = false, bgmOn = true, bgmTimer = null, bgmStep = 0;
  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function playTone(freq, startFreq, duration, type = 'square', vol = 0.08, rampTo) {
    ensureCtx(); const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(startFreq || freq, t);
    if (rampTo) osc.frequency.linearRampToValueAtTime(rampTo, t + duration);
    gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + duration);
  }
  function eat() { playTone(400, 200, 0.1, 'square', 0.07, 700); }
  function die() {
    ensureCtx(); const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, t);
    osc.frequency.linearRampToValueAtTime(80, t + 0.4);
    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + 0.5);
  }
  function unlock() {
    ensureCtx(); const t = ctx.currentTime;
    [523, 659, 784].forEach((f, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t + i * 0.12);
      gain.gain.setValueAtTime(0.06, t + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.2);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.25);
    });
  }
  function click() { playTone(800, 800, 0.04, 'sine', 0.04); }
  const melody = [262, 294, 330, 349, 392, 349, 330, 294, 262, 330, 392, 523, 392, 330, 294, 262];
  function playBgmNote() {
    if (!bgmOn || !bgmPlaying) return;
    ensureCtx(); const note = melody[bgmStep % melody.length]; const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(note, t);
    gain.gain.setValueAtTime(0.03, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + 0.2);
    if (bgmStep % 4 === 0) {
      const bOsc = ctx.createOscillator(), bGain = ctx.createGain();
      bOsc.type = 'sine'; bOsc.frequency.setValueAtTime(note / 2, t);
      bGain.gain.setValueAtTime(0.05, t); bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      bOsc.connect(bGain); bGain.connect(ctx.destination); bOsc.start(t); bOsc.stop(t + 0.4);
    }
    bgmStep++; bgmTimer = setTimeout(playBgmNote, 220);
  }
  function startBgm() { if (bgmPlaying) return; bgmPlaying = true; bgmStep = 0; playBgmNote(); }
  function stopBgm() { bgmPlaying = false; if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; } }
  function toggleBgm() { bgmOn = !bgmOn; if (bgmOn && !bgmPlaying) startBgm(); return bgmOn; }
  return { eat, die, unlock, click, startBgm, stopBgm, toggleBgm, isOn: () => bgmOn };
})();

// ============ CONSTS & STATE ============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 520, H = 520;
canvas.width = W; canvas.height = H;

const HEAD_R = 10, BODY_R = 6.5, SEG_SPACING = 13;
const FOOD_R = 8, OBS_R = 15;
const MIN_LEN = 8;

const SKINS = [
  { id: 'classic', name: '经典绿',   score: 0,    h: 150, s: 65, desc: '初心之绿' },
  { id: 'flame',   name: '烈焰红',   score: 50,   h: 10,  s: 85, desc: '热情似火' },
  { id: 'ice',     name: '冰霜蓝',   score: 100,  h: 200, s: 70, desc: '冷酷冰晶' },
  { id: 'gold',    name: '黄金蟒',   score: 200,  h: 44,  s: 80, desc: '高贵金黄' },
  { id: 'neon',    name: '霓虹紫',   score: 350,  h: 290, s: 80, desc: '霓虹闪耀' },
  { id: 'rainbow', name: '彩虹',     score: 500,  h: 0,   s: 80, desc: '七彩斑斓' },
  { id: 'shadow',  name: '暗影',     score: 750,  h: 140, s: 15, desc: '暗夜行者' },
  { id: 'galaxy',  name: '星空',     score: 1000, h: 250, s: 55, desc: '星辰大海' },
];

const DIFFICULTIES = {
  easy:   { name: '简单', speed: 2.2, turnRate: 0.13, obstacles: 0,  color: '#4caf50' },
  normal: { name: '普通', speed: 3.2, turnRate: 0.12, obstacles: 0,  color: '#f39c12' },
  hard:   { name: '困难', speed: 4.0, turnRate: 0.10, obstacles: 4,  color: '#e94560' },
  hell:   { name: '地狱', speed: 5.0, turnRate: 0.09, obstacles: 8,  color: '#c084fc' },
};
let difficulty = 'normal';
let obstacles = [];

let snake, food, angle, targetAngle, foodEaten = 0;
let score, high, running = false, paused = false;
let particles = [], rainbowHue = 0;
let unlockedSkins = new Set();
let currentSkinId = 'classic';
let mouseX = -100, mouseY = -100; // offscreen until mouse enters canvas
let mouseOnCanvas = false;
let animId = null;
let isTouchDevice = false;
// Mobile joystick state (drawn on canvas)
let jsActive = false, jsX = 0, jsY = 0, jsDX = 0, jsDY = 0;
// Double-tap detection
let lastTapTime = 0;

function generateObstacles(count) {
  const obs = [];
  for (let i = 0; i < count; i++) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const o = { x: OBS_R + Math.random() * (W - OBS_R * 2), y: OBS_R + Math.random() * (H - OBS_R * 2) };
      // Avoid center spawn area
      const tooClose = Math.hypot(o.x - W / 2, o.y - H * 0.75) < 80;
      const tooNearOther = obs.some(p => Math.hypot(o.x - p.x, o.y - p.y) < OBS_R * 2.5);
      if (!tooClose && !tooNearOther) { obs.push(o); break; }
    }
  }
  return obs;
}

function lsGet(key, fallback) { try { const v = localStorage.getItem(key); return v !== null ? v : fallback; } catch(e) { return fallback; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); return true; } catch(e) { return false; } }

// Load
high = parseInt(lsGet('snakeHighV5', '0')) || 0;
const savedSkinId = lsGet('snakeSkinV5', 'classic');
const savedUnlocked = JSON.parse(lsGet('snakeUnlockedV5', '["classic"]'));
unlockedSkins = new Set(savedUnlocked);
currentSkinId = unlockedSkins.has(savedSkinId) ? savedSkinId : 'classic';
document.getElementById('high').textContent = high;
document.getElementById('skinBadge').textContent = SKINS.find(s => s.id === currentSkinId).name;
document.getElementById('diffBadge').style.background = DIFFICULTIES[difficulty].color;

function isUnlocked(skinId) { return unlockedSkins.has(skinId); }
function unlockSkin(skinId) {
  if (unlockedSkins.has(skinId)) return false;
  unlockedSkins.add(skinId);
  lsSet('snakeUnlockedV5', JSON.stringify([...unlockedSkins]));
  AudioEngine.unlock();
  renderSkinPanel();
  return true;
}
function setSkin(skinId) {
  if (!isUnlocked(skinId) || running) return;
  currentSkinId = skinId;
  lsSet('snakeSkinV5', skinId);
  document.getElementById('skinBadge').textContent = SKINS.find(s => s.id === skinId).name;
  renderSkinPanel();
  if (!running) draw();
}

// ============ OVERLAY ============
function renderDiffButtons(containerId) {
  const dg = document.getElementById(containerId);
  if (!dg) return;
  Object.entries(DIFFICULTIES).forEach(([key, val]) => {
    const btn = document.createElement('button');
    btn.className = 'diff-btn' + (key === difficulty ? ' sel' : '');
    btn.textContent = val.name; btn.dataset.diff = key;
    btn.addEventListener('click', (e) => {
      e.stopPropagation(); AudioEngine.click();
      difficulty = key;
      dg.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      document.getElementById('diffBadge').textContent = val.name;
      document.getElementById('diffBadge').style.background = val.color;
      init(); updateProgress(); draw();
    });
    dg.appendChild(btn);
  });
}

function showOverlay(type) {
  const overlay = document.getElementById('overlay');
  const content = document.getElementById('overlayContent');
  overlay.classList.remove('hidden');
  let title = '贪 吃 蛇', btnText = '开始游戏', scoreHTML = '';
  if (type === 'over') { title = '游戏结束'; btnText = '再来一局'; scoreHTML = `<div class="final-score">得分 <b>${score}</b></div>`; }
  if (type === 'win')  { title = '你赢了!'; btnText = '再来一局'; scoreHTML = `<div class="final-score">得分 <b>${score}</b></div>`; }
  content.innerHTML = `<h2>${title}</h2>${scoreHTML}<div class="diff-group" id="diffGroup"></div><button id="overlayBtn">${btnText}</button>`;
  renderDiffButtons('diffGroup');
  document.getElementById('overlayBtn').addEventListener('click', startGame);
}
function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }

function startGame() {
  hideOverlay();
  init();
  running = true; paused = false;
  document.body.classList.add('playing');
  document.getElementById('msg').textContent = '';
  draw();
  if (animId) cancelAnimationFrame(animId);
  loop();
  AudioEngine.startBgm();
}

// ============ GAME LOGIC ============
function init() {
  const d = DIFFICULTIES[difficulty];
  const startX = W / 2, startY = H * 0.75;
  snake = [];
  for (let i = 0; i < MIN_LEN + 2; i++) {
    snake.push({ x: startX, y: startY + i * SEG_SPACING });
  }
  angle = -Math.PI / 2; targetAngle = -Math.PI / 2;
  score = 0; foodEaten = 0; particles = [];
  obstacles = generateObstacles(d.obstacles);
  food = spawnFood();
  document.getElementById('score').textContent = '0';
  document.getElementById('diffBadge').textContent = d.name;
  document.getElementById('diffBadge').style.background = d.color;
  updateProgress();
}

function spawnFood() {
  for (let attempt = 0; attempt < 200; attempt++) {
    const f = { x: FOOD_R + 10 + Math.random() * (W - FOOD_R * 2 - 20), y: FOOD_R + 10 + Math.random() * (H - FOOD_R * 2 - 20) };
    let ok = true;
    for (const s of snake) { if (Math.hypot(f.x - s.x, f.y - s.y) < FOOD_R + HEAD_R + 12) { ok = false; break; } }
    if (ok) for (const o of obstacles) { if (Math.hypot(f.x - o.x, f.y - o.y) < FOOD_R + OBS_R + 6) { ok = false; break; } }
    if (ok) return f;
  }
  return { x: 100, y: 100 }; // fallback
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.6 + Math.random() * 2.2;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.015 + Math.random() * 0.03, color, size: 0.6 + Math.random() * 1.6,
    });
  }
}

function step() {
  const d = DIFFICULTIES[difficulty];
  // Smooth turn
  let da = targetAngle - angle;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  da = Math.max(-d.turnRate, Math.min(d.turnRate, da));
  angle += da;

  const head = snake[0];
  const newHead = { x: head.x + Math.cos(angle) * d.speed, y: head.y + Math.sin(angle) * d.speed };

  // Boundary
  if (newHead.x < HEAD_R || newHead.x > W - HEAD_R || newHead.y < HEAD_R || newHead.y > H - HEAD_R) return endGame('over');

  // Self collision (skip first few segments near head)
  for (let i = 6; i < snake.length; i++) {
    if (Math.hypot(newHead.x - snake[i].x, newHead.y - snake[i].y) < HEAD_R + BODY_R - 4) return endGame('over');
  }

  // Obstacle collision
  for (const o of obstacles) {
    if (Math.hypot(newHead.x - o.x, newHead.y - o.y) < HEAD_R + OBS_R - 5) return endGame('over');
  }

  snake.unshift(newHead);

  // Food check
  if (Math.hypot(newHead.x - food.x, newHead.y - food.y) < HEAD_R + FOOD_R) {
    score += 10;
    document.getElementById('score').textContent = score;
    floatScore();
    AudioEngine.eat();
    let pColor = '#f39c12';
    if (currentSkinId === 'rainbow') pColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
    else if (currentSkinId === 'shadow') pColor = '#22d3ee';
    else if (currentSkinId === 'neon') pColor = '#e879f9';
    else if (currentSkinId === 'ice') pColor = '#bae6fd';
    else if (currentSkinId === 'flame') pColor = '#ff6b35';
    spawnParticles(food.x, food.y, pColor);

    food = spawnFood();
    foodEaten++;

    for (const skin of SKINS) {
      if (score >= skin.score && !isUnlocked(skin.id)) {
        unlockSkin(skin.id);
        document.getElementById('msg').textContent = '解锁新皮肤: ' + skin.name + '!';
        setTimeout(() => { if (document.getElementById('msg').textContent.includes('解锁')) document.getElementById('msg').textContent = ''; }, 2000);
      }
    }
    updateProgress();
    if (score > high) { high = score; lsSet('snakeHighV5', high); document.getElementById('high').textContent = high; }
  } else {
    // Pull each body segment toward the one ahead to maintain spacing
    for (let i = 1; i < snake.length; i++) {
      const prev = snake[i - 1], curr = snake[i];
      const dx = prev.x - curr.x, dy = prev.y - curr.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > SEG_SPACING) {
        const m = (dist - SEG_SPACING) / dist;
        curr.x += dx * m; curr.y += dy * m;
      }
    }
    // Keep exactly MIN_LEN + foodEaten segments
    const targetLen = MIN_LEN + foodEaten;
    while (snake.length > targetLen) snake.pop();
  }

  updateParticles();
  draw();
}

function endGame(type) {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  document.body.classList.remove('playing');
  AudioEngine.stopBgm();
  AudioEngine.die();
  if (score > high) { high = score; lsSet('snakeHighV5', high); document.getElementById('high').textContent = high; }
  setTimeout(() => showOverlay(type), 400);
}

function loop() {
  if (!running) return;
  if (!paused) step();
  if (currentSkinId === 'rainbow' && !paused) rainbowHue = (rainbowHue + 0.8) % 360;
  animId = requestAnimationFrame(loop);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById('msg').textContent = paused ? '已暂停' : '';
}

function floatScore() {
  const wrap = document.getElementById('canvasWrap');
  const el = document.createElement('div');
  el.className = 'float-text'; el.textContent = '+10';
  el.style.left = food.x + 'px'; el.style.top = food.y + 'px';
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx += (Math.random() - 0.5) * 0.15;
    p.vy += (Math.random() - 0.5) * 0.15;
    p.vx *= 0.99; p.vy *= 0.99;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateProgress() {
  let nextSkin = null;
  for (const skin of SKINS) { if (score < skin.score) { nextSkin = skin; break; } }
  if (nextSkin) {
    const need = nextSkin.score - score;
    const idx = SKINS.indexOf(nextSkin);
    const prev = idx > 0 ? SKINS[idx - 1] : { score: 0 };
    const total = nextSkin.score - prev.score;
    const pct = total > 0 ? ((score - prev.score) / total * 100) : 100;
    document.getElementById('progressLabel').textContent = `下一皮肤: ${nextSkin.name} (还需${need}分)`;
    document.getElementById('progressBar').style.width = pct + '%';
  } else {
    document.getElementById('progressLabel').textContent = '全部皮肤已解锁!';
    document.getElementById('progressBar').style.width = '100%';
  }
}

// ============ DRAWING ============
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Subtle radial gradient background
  const bg = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.75);
  bg.addColorStop(0, '#0d0d24'); bg.addColorStop(1, '#060612');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Obstacles
  obstacles.forEach(o => {
    ctx.fillStyle = 'rgba(180,40,40,0.4)';
    ctx.beginPath(); ctx.arc(o.x, o.y, OBS_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,80,80,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(o.x, o.y, OBS_R, 0, Math.PI * 2); ctx.stroke();
    // X
    ctx.strokeStyle = 'rgba(255,120,120,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(o.x - 7, o.y - 7); ctx.lineTo(o.x + 7, o.y + 7);
    ctx.moveTo(o.x + 7, o.y - 7); ctx.lineTo(o.x - 7, o.y + 7); ctx.stroke();
  });

  // Food
  drawFood();

  // Snake body (tail to head)
  const skin = SKINS.find(s => s.id === currentSkinId);
  let hue = skin.h, sat = skin.s;
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const ratio = 1 - (i / Math.max(snake.length - 1, 1));
    const r = BODY_R + ratio * (HEAD_R - BODY_R);

    if (currentSkinId === 'rainbow') {
      ctx.fillStyle = `hsl(${(rainbowHue + i * 12) % 360}, 75%, ${35 + ratio * 25}%)`;
    } else if (currentSkinId === 'shadow') {
      const l = 10 + ratio * 22;
      ctx.fillStyle = `hsl(140, 20%, ${l}%)`;
      if (i === 0) { ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 8; }
    } else if (currentSkinId === 'galaxy') {
      ctx.fillStyle = `hsl(${240 + i * 2}, 55%, ${28 + ratio * 25}%)`;
    } else {
      ctx.fillStyle = `hsl(${hue}, ${sat}%, ${30 + ratio * 28}%)`;
    }
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Skin-specific body details
    if (currentSkinId === 'gold' && i > 0 && i % 3 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    }
    if (currentSkinId === 'neon' && i === 0) {
      ctx.shadowColor = '#e879f9'; ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Eyes on head
    if (i === 0) {
      const ex1 = s.x + Math.cos(angle - 0.6) * 5, ey1 = s.y + Math.sin(angle - 0.6) * 5;
      const ex2 = s.x + Math.cos(angle + 0.6) * 5, ey2 = s.y + Math.sin(angle + 0.6) * 5;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex1, ey1, 2.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, 2.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(ex1 + Math.cos(angle) * 1.2, ey1 + Math.sin(angle) * 1.2, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2 + Math.cos(angle) * 1.2, ey2 + Math.sin(angle) * 1.2, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Custom cursor (desktop only)
  if (!isTouchDevice && mouseOnCanvas) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(233,69,96,0.7)';
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2); ctx.fill();
    // Crosshair lines
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.7;
    const cl = 14;
    ctx.beginPath(); ctx.moveTo(mouseX - cl, mouseY); ctx.lineTo(mouseX - 5, mouseY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouseX + 5, mouseY); ctx.lineTo(mouseX + cl, mouseY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouseX, mouseY - cl); ctx.lineTo(mouseX, mouseY - 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouseX, mouseY + 5); ctx.lineTo(mouseX, mouseY + cl); ctx.stroke();
  }

  // Mobile joystick (drawn on canvas, semi-transparent)
  if (isTouchDevice && jsActive) {
    const maxR = 40;
    const dist = Math.sqrt(jsDX * jsDX + jsDY * jsDY);
    const clampDist = Math.min(dist, maxR - 14);
    const nx = dist > 0 ? (jsDX / dist) * clampDist : 0;
    const ny = dist > 0 ? (jsDY / dist) * clampDist : 0;

    ctx.globalAlpha = 0.35;
    // Base ring
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jsX, jsY, maxR, 0, Math.PI * 2); ctx.stroke();
    // Knob
    const kx = jsX + nx, ky = jsY + ny;
    ctx.fillStyle = 'rgba(233,69,96,0.5)';
    ctx.beginPath(); ctx.arc(kx, ky, 16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(233,69,96,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(kx, ky, 16, 0, Math.PI * 2); ctx.stroke();
    // Direction indicator
    if (dist > 8) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(jsX, jsY); ctx.lineTo(kx, ky); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function drawFood() {
  const fx = food.x, fy = food.y;
  ctx.save();
  switch (currentSkinId) {
    case 'classic':
      ctx.fillStyle = '#c23152'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(fx - 2, fy - 2, FOOD_R * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(fx, fy - FOOD_R + 1); ctx.lineTo(fx + 2, fy - FOOD_R - 3); ctx.stroke();
      ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.ellipse(fx + 4, fy - FOOD_R + 1, 3.5, 2, 0.3, 0, Math.PI * 2); ctx.fill();
      break;
    case 'flame':
      ctx.fillStyle = '#ff4500'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8c00'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R * 0.6, 0, Math.PI * 2); ctx.fill();
      break;
    case 'ice':
      ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 1.5;
      for (let si = 0; si < 6; si++) {
        const sa = si * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(fx + Math.cos(sa) * 2, fy + Math.sin(sa) * 2);
        ctx.lineTo(fx + Math.cos(sa) * FOOD_R, fy + Math.sin(sa) * FOOD_R); ctx.stroke();
      }
      break;
    case 'gold':
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R * 0.65, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#d97706'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('¥', fx, fy + 1);
      break;
    case 'neon':
      ctx.shadowColor = '#e879f9'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#d946ef'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(232,121,249,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'rainbow':
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 6;
      ctx.beginPath(); drawStarPath(fx, fy, FOOD_R, FOOD_R * 0.4, 5); ctx.fill(); ctx.shadowBlur = 0;
      break;
    case 'shadow':
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#06b6d4'; const hs = FOOD_R * 0.85;
      ctx.beginPath(); ctx.moveTo(fx, fy - hs); ctx.lineTo(fx + hs, fy); ctx.lineTo(fx, fy + hs); ctx.lineTo(fx - hs, fy); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    case 'galaxy':
      ctx.fillStyle = '#7c3aed'; ctx.beginPath(); ctx.arc(fx, fy, FOOD_R * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(250,204,21,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(fx, fy, FOOD_R + 1, FOOD_R * 0.3, -0.3, 0, Math.PI * 2); ctx.stroke();
      break;
  }
  ctx.restore();
}

function drawStarPath(cx, cy, outerR, innerR, points) {
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const sx = cx + Math.cos(angle) * r, sy = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.closePath();
}

// ============ SKIN PANEL ============
function renderSkinPanel() {
  const grid = document.getElementById('skinGrid');
  grid.innerHTML = '';
  SKINS.forEach(skin => {
    const card = document.createElement('div');
    card.className = 'skin-card';
    if (skin.id === currentSkinId) card.classList.add('active');
    if (!isUnlocked(skin.id)) card.classList.add('locked');

    const sw = document.createElement('div');
    sw.className = 'skin-swatch';
    switch (skin.id) {
      case 'classic': sw.style.background = 'linear-gradient(135deg, #2d8a4e, #1a5c30)'; break;
      case 'flame':   sw.style.background = 'linear-gradient(135deg, #ff4500, #8b0000)'; break;
      case 'ice':     sw.style.background = 'linear-gradient(135deg, #38bdf8, #1e40af)'; break;
      case 'gold':    sw.style.background = 'linear-gradient(135deg, #fbbf24, #92400e)'; break;
      case 'neon':    sw.style.background = 'linear-gradient(135deg, #d946ef, #4a0e5c)'; break;
      case 'rainbow': sw.style.background = 'linear-gradient(90deg, red, yellow, lime, cyan, blue, magenta, red)'; break;
      case 'shadow':  sw.style.background = '#0f1f14'; sw.style.boxShadow = 'inset 0 0 8px #22d3ee'; break;
      case 'galaxy':  sw.style.background = 'linear-gradient(135deg, #1e1b4b, #312e81)'; sw.style.boxShadow = 'inset 0 0 3px #fff'; break;
    }

    const info = document.createElement('div');
    info.className = 'skin-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'skin-name'; nameEl.textContent = skin.name;
    const scoreEl = document.createElement('div');
    scoreEl.className = 'skin-score';
    scoreEl.textContent = isUnlocked(skin.id) ? skin.desc : skin.score + '分解锁';
    info.appendChild(nameEl); info.appendChild(scoreEl);
    card.appendChild(sw); card.appendChild(info);

    card.addEventListener('click', () => {
      AudioEngine.click();
      if (!isUnlocked(skin.id) || running) return;
      setSkin(skin.id);
    });
    grid.appendChild(card);
  });
}

// ============ INPUT ============
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height),
  };
}

// Desktop mouse
canvas.addEventListener('mousemove', e => {
  const p = canvasPos(e);
  mouseX = p.x; mouseY = p.y; mouseOnCanvas = true;
  if (running && !paused) {
    targetAngle = Math.atan2(mouseY - snake[0].y, mouseX - snake[0].x);
  }
});
canvas.addEventListener('mouseleave', () => { mouseOnCanvas = false; });
canvas.addEventListener('mouseenter', () => { mouseOnCanvas = true; });
// Double-click to pause on desktop
canvas.addEventListener('dblclick', e => { e.preventDefault(); togglePause(); });

// Keyboard fallback
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePause(); return; }
  if (!running || paused) return;
  const key = e.key.toLowerCase();
  let ta = null;
  if (key === 'arrowup' || key === 'w') ta = -Math.PI / 2;
  if (key === 'arrowdown' || key === 's') ta = Math.PI / 2;
  if (key === 'arrowleft' || key === 'a') ta = Math.PI;
  if (key === 'arrowright' || key === 'd') ta = 0;
  if (ta !== null) targetAngle = ta;
});

// Mobile: touch joystick on canvas
function setupMobile() {
  isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!isTouchDevice) return;
  document.body.style.cursor = 'auto';

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTapTime < 300) { togglePause(); lastTapTime = 0; return; }
    lastTapTime = now;
    const p = canvasPos(e.touches[0]);
    jsActive = true; jsX = p.x; jsY = p.y; jsDX = 0; jsDY = 0;
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!jsActive) return;
    const p = canvasPos(e.touches[0]);
    jsDX = p.x - jsX; jsDY = p.y - jsY;
    if (running && !paused) {
      const dist = Math.sqrt(jsDX * jsDX + jsDY * jsDY);
      if (dist > 8) targetAngle = Math.atan2(jsDY, jsDX);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => { e.preventDefault(); jsActive = false; });
  canvas.addEventListener('touchcancel', () => { jsActive = false; });
}
setupMobile();

// Sound
let soundOn = true;
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = AudioEngine.toggleBgm();
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) AudioEngine.click();
});

// Export/Import
document.getElementById('exportLink').addEventListener('click', () => {
  AudioEngine.click();
  const data = { high, skin: currentSkinId, unlocked: [...unlockedSkins], v: 5 };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'snake-save.json'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importLink').addEventListener('click', () => {
  AudioEngine.click();
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
  input.addEventListener('change', () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.unlocked || !Array.isArray(data.unlocked)) throw new Error('格式错误');
        high = data.high || 0; unlockedSkins = new Set(data.unlocked);
        currentSkinId = unlockedSkins.has(data.skin) ? data.skin : 'classic';
        lsSet('snakeHighV5', high); lsSet('snakeUnlockedV5', JSON.stringify([...unlockedSkins])); lsSet('snakeSkinV5', currentSkinId);
        document.getElementById('high').textContent = high;
        document.getElementById('skinBadge').textContent = SKINS.find(s => s.id === currentSkinId).name;
        renderSkinPanel(); init(); updateProgress(); draw();
      } catch(e) { alert('存档格式不正确: ' + e.message); }
    };
    reader.readAsText(file);
  });
  input.click();
});
document.getElementById('resetLink').addEventListener('click', () => {
  if (!confirm('确定重置所有皮肤进度吗？')) return;
  AudioEngine.click();
  unlockedSkins = new Set(['classic']); currentSkinId = 'classic';
  lsSet('snakeUnlockedV5', JSON.stringify(['classic'])); lsSet('snakeSkinV5', 'classic');
  document.getElementById('skinBadge').textContent = '经典绿';
  renderSkinPanel(); updateProgress(); draw();
});

// Init
renderSkinPanel();
init();
updateProgress();
draw();
showOverlay('start');
</script>
